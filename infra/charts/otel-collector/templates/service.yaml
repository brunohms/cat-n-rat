apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "otel-collector.selectorLabels" . | nindent 4 }}
  # Each pod sends its telemetry to the collector on its own node
  internalTrafficPolicy: Local
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
